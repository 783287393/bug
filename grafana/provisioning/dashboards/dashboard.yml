apiVersion: 1

providers:
  - name: observability-lab
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # 容器路线：dashboard.json 已通过 compose 挂载到该容器内路径；
      # 原生本机路线（无容器）改回 D:/bug management/observability-lab/grafana/dashboards
      path: /var/lib/grafana/dashboards
